[project]
name = "ma-assist"
version = "0.3.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
